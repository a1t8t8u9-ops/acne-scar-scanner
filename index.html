<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Acne Scar Scanner v0.3</title>
</head>
<body>
<header>
  <div>
    <h1>Acne Scar Scanner <span>v0.3</span></h1>
    <p>Realtime alignment PWA</p>
  </div>
</header>

<main>
  <section class="card">
    <h2>1. 基準写真を選ぶ</h2>
    <input id="refInput" type="file" accept="image/*" />
    <p class="note">できれば同じ頬・同じ表情の過去写真を選びます。まず顔の位置関係を基準化します。</p>
    <canvas id="refCanvas" class="thumb" hidden></canvas>
  </section>

  <section class="card">
    <h2>2. カメラで位置合わせ</h2>

    <div id="stage" class="stage">
      <video id="video" autoplay muted playsinline></video>
      <img id="ghost" alt="" />
      <canvas id="overlay"></canvas>
      <div id="guide" class="guide">基準写真を選択してください</div>
      <div id="metrics" class="metrics">—</div>
    </div>

    <div class="toolbar">
      <button id="startBtn" class="primary">カメラ開始</button>
      <button id="switchBtn">前/後切替</button>
      <button id="captureBtn" class="success" disabled>撮影</button>
    </div>

    <label class="slider">
      <span>ゴースト</span>
      <input id="ghostOpacity" type="range" min="0" max="100" value="30">
      <output id="ghostOpacityOut">30%</output>
    </label>

    <div class="status-grid">
      <div><span>位置</span><strong id="posStatus">—</strong></div>
      <div><span>大きさ</span><strong id="scaleStatus">—</strong></div>
      <div><span>傾き</span><strong id="rotStatus">—</strong></div>
    </div>
  </section>

  <section class="card">
    <h2>3. 撮影結果</h2>
    <div class="pair">
      <figure>
        <img id="refPreview" alt="">
        <figcaption>Reference</figcaption>
      </figure>
      <figure>
        <img id="capturePreview" alt="">
        <figcaption>New</figcaption>
      </figure>
    </div>
    <button id="compareBtn" class="primary" disabled>重ね合わせ確認</button>
    <canvas id="compareCanvas" class="compare" hidden></canvas>
  </section>

  <section class="card">
    <h2>この版の判定</h2>
    <p class="warning">
      v0.3は「顔の中心・顔サイズ・傾き」を合わせるための試作です。
      ニキビ跡の深さや改善率はまだ計算しません。次段階で頬ROIを固定し、局所位置合わせを追加します。
    </p>
  </section>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
